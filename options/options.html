<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PurgPak Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 data-i18n="optionsTitle"></h1>
      <span class="version">v1.7.5 <span data-i18n="optionsByLabel"></span> CybTekSol [ https://github.com/CybTekSol ]</span>
    </header>

    <section class="card">
      <h2 data-i18n="optionsNotificationsHeader"></h2>
      <label class="toggle-row">
        <input type="checkbox" id="notify_summary">
        <span data-i18n="optionsNotifySummary"></span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="play_sound">
        <span data-i18n="optionsPlaySound"></span>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="optionsActionsHeader"></h2>
      <p class="description" data-i18n="optionsActionsDescription"></p>
      <table class="account-table" id="accounts_table">
        <thead>
          <tr>
            <th data-i18n="optionsAccount"></th>
            <th data-i18n="optionsEmptyJunk"></th>
            <th data-i18n="optionsEmptyTrash"></th>
            <th data-i18n="optionsCompactFolders"></th>
          </tr>
        </thead>
        <tbody id="accounts_tbody">
          <!-- Dynamically injected account rows -->
        </tbody>
      </table>
    </section>

    <footer>
      <button id="save_btn" class="primary-btn" data-i18n="optionsSaveButton"></button>
      <span id="status_msg" class="status-msg"></span>
    </footer>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
